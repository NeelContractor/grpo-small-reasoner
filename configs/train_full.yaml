# Full GRPO run for Colab/Kaggle T4 (16 GB).
# For the larger option, change model.name to Qwen/Qwen2.5-1.5B-Instruct and
# lower per_device_train_batch_size if you hit OOM.
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: auto

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  split: train
  limit: null
  seed: 42

training:
  output_dir: outputs/grpo-qwen2.5-0.5b
  learning_rate: 1.0e-5
  # In TRL, this is the number of completions per device. With
  # num_generations=8, 8 completions means one prompt per optimizer step.
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 200
  num_generations: 8
  max_completion_length: 512
  temperature: 1.0
  beta: 0.04
  logging_steps: 1
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  optim: adamw_torch
  use_cpu: false
  fp16: true
  bf16: false
  report_to: wandb
  project: grpo-small-reasoner
  run_name: qwen2.5-0.5b-gsm8k-grpo
  log_completions: true
  seed: 42

rewards:
  format_weight: 0.5
  length_penalty:
    enabled: false
    target_chars: 2000
    weight: 0.1

hub:
  push: false
  repo_id: null
  private: true

unsloth:
  enabled: false
  load_in_4bit: false
  max_seq_length: 2048
